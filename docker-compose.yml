# docker compose up --build   ->  UI http://localhost:3000, API http://localhost:8080/swagger-ui.html
services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: library
      MYSQL_PASSWORD: library
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"  # for running the backend outside Docker
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulibrary", "-plibrary"]
      interval: 5s
      retries: 20

  backend:
    build: ./backend
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: db
      # demo value; set your own Base64 key (openssl rand -base64 32) outside of local use
      JWT_SECRET: ${JWT_SECRET:-ZGV2LW9ubHktc2VjcmV0LWRvLW5vdC11c2UtaW4tcHJvZHVjdGlvbi0xMjM0NTY=}
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  db-data:
