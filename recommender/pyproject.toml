[project]
name = "library-recommender"
version = "1.0.0"
description = "Embedding service for the library's semantic search and recommendations"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "sentence-transformers>=3.3",
    "torch>=2.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.8"]

[tool.uv]
package = false

# CPU-only PyTorch: the model is small and the wheel is a fraction of the CUDA one
[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
